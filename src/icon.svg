<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="9" y="9" width="238" height="238" rx="51" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Cybernetic Focus Ring -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Futuristic Geometric Anvil -->
  <path d="M 46 142 
           C 54 138 62 130 68 118 
           L 188 118 
           C 202 118 214 124 220 134 
           C 212 140 198 142 180 142 
           L 154 142 
           L 160 170 
           L 188 196 
           L 68 196 
           L 96 170 
           L 102 142 
           Z" 
        fill="url(#forgeGrad)"
        filter="url(#softGlow)"/>

  <!-- High-Impact Electric Bolt Striking the Anvil -->
  <path d="M 148 32 L 96 124 L 132 124 L 112 206 L 178 102 L 140 102 Z" 
        fill="url(#boltGrad)" 
        stroke="#03050a" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>
</svg>
