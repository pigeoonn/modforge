[package]
name = "modforge"
version = "6.0.0"
edition = "2021"
authors = ["David"]
license = "GPL-3.0-or-later"
description = "ModForge: Universal Game & Mod Studio for Linux, Steam Deck & PC"
repository = "https://github.com/pigeoonn/gantry"
homepage = "https://github.com/pigeoonn/gantry"
readme = "README.md"
keywords = ["mods", "games", "modding", "steam", "linux"]
categories = ["games"]

[dependencies]
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
memchr = "2.7"
rayon = "1.10"
notify = "=6.1.1"
walkdir = "2.5"
regex = "1.11"
rfd = "0.15"
roxmltree = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
same-file = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = false
strip = true
