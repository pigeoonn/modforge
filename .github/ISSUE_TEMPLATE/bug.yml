name: Something does not work
description: A bug or a mod that is installed wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: ModForge version (Settings) and system }
    validations: { required: true }
  - type: input
    id: game
    attributes: { label: Which game, and where it comes from (Steam, Hydra, Heroic...) }
  - type: textarea
    id: what
    attributes: { label: What happened, and what you expected }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: 'The activity log (Tools → Problem Report copies it)', render: shell }
