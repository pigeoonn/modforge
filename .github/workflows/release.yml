name: Release

# Push a tag like v5.1.0 to build the Linux binary and attach it to a GitHub release.
# "Run workflow" (manual) only builds and keeps the files as a downloadable artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag only becomes a release when the checks (tests, screen test and the journeys on all three systems) of
  # that exact commit passed. A manual run does not publish anything, so it is not held up.
  checks-passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for the checks of this commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            res=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
            echo "attempt $i: ${res:-no run yet}"
            case "$res" in
              "completed success") exit 0 ;;
              completed*) echo "The checks of this commit did not pass: no release."; exit 1 ;;
            esac
            sleep 30
          done
          echo "The checks did not finish in time."; exit 1

  windows-x86_64:
    needs: checks-passed
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          dir="gantry-${ver}-windows-x86_64"
          mkdir "$dir"
          cp target/release/rig.exe "$dir/"
          cp README.md docs/INSTALL.md "$dir/"
          7z a "$dir.zip" "$dir"
          sha256sum "$dir.zip" > "$dir.zip.sha256"
      # The installer is a bonus next to the zip: if building it fails, the release still goes out.
      - name: Installer
        id: installer
        continue-on-error: true
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || { choco install innosetup --no-progress -y; }
          # no path conversion of the /D switch by the shell
          MSYS_NO_PATHCONV=1 "$iscc" "/DAppVer=${ver}" packaging/windows/gantry.iss
          sha256sum "gantry-${ver}-windows-x86_64-setup.exe" > "gantry-${ver}-windows-x86_64-setup.exe.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-windows-x86_64
          path: |
            gantry-*.zip
            gantry-*.zip.sha256
            gantry-*-setup.exe
            gantry-*-setup.exe.sha256
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" gantry-*.zip gantry-*.zip.sha256 --clobber
          ls gantry-*-setup.exe >/dev/null 2>&1 && gh release upload "$GITHUB_REF_NAME" gantry-*-setup.exe gantry-*-setup.exe.sha256 --clobber || echo "no installer in this run"

  macos-arm64:
    needs: checks-passed
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          dir="gantry-${ver}-macos-arm64"
          mkdir "$dir"
          cp target/release/rig "$dir/"
          cp README.md docs/INSTALL.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-macos-arm64
          path: |
            gantry-*.tar.gz
            gantry-*.tar.gz.sha256
      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" gantry-*.tar.gz gantry-*.tar.gz.sha256 --clobber

  linux-x86_64:
    needs: checks-passed
    # the oldest runner we can use: the binary then runs on any newer distribution (glibc)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Package
        id: pack
        run: |
          ver="${GITHUB_REF_NAME:-dev}"
          dir="gantry-${ver}-linux-x86_64"
          mkdir "$dir"
          cp target/release/rig "$dir/"
          cp README.md docs/INSTALL.md packaging/gantry.desktop src/icon.png src/icon.svg "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
          echo "file=$dir.tar.gz" >> "$GITHUB_OUTPUT"
      - name: AppImage
        run: |
          packaging/appimage/build.sh target/release/rig "$PWD/appimage"
          cp appimage/Gantry-*.AppImage .
          sha256sum Gantry-*.AppImage > "$(ls Gantry-*.AppImage).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gantry-linux-x86_64
          path: |
            gantry-*.tar.gz
            gantry-*.tar.gz.sha256
            Gantry-*.AppImage
            Gantry-*.AppImage.sha256
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" gantry-*.tar.gz gantry-*.tar.gz.sha256 Gantry-*.AppImage Gantry-*.AppImage.sha256 \
            --title "Gantry $GITHUB_REF_NAME (beta)" --prerelease \
            --notes "Beta. Linux is where Gantry is developed and tested; the Windows and macOS builds are made automatically and have had much less testing, so please report what breaks. Downloads: Linux AppImage (chmod +x, run) or tar.gz (unpack, run \`./rig --install\`), Windows zip (run rig.exe), macOS tar.gz. What changed: CHANGELOG.md. How to install: docs/INSTALL.md."
